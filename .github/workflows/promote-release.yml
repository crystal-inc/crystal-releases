name: Promote Crystal release
run-name: Promote build ${{ inputs.build_id || 'current' }} (${{ inputs.promotion }})

on:
  workflow_dispatch:
    inputs:
      promotion:
        description: Promotion path
        type: choice
        options:
          - nightly → latest
          - latest → stable
          - nightly → stable
        default: nightly → latest
        required: true
      build_id:
        description: Build ID from a channel release; leave empty for the current build in the selected source
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release-channels
  cancel-in-progress: false

jobs:
  promote:
    name: Promote verified installers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install release tooling
        run: npm ci --ignore-scripts
      - name: Check types and promotion rules
        run: |
          npm run check-types
          npm test
      - name: Promote exactly the selected verified build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ fromJSON('{"nightly → latest":"latest","latest → stable":"stable","nightly → stable":"stable"}')[inputs.promotion] }}
          RELEASE_SOURCE: ${{ fromJSON('{"nightly → latest":"nightly","latest → stable":"latest","nightly → stable":"nightly"}')[inputs.promotion] }}
          RELEASE_BUILD_ID: ${{ inputs.build_id }}
        run: npm run release -- promote --target "$RELEASE_TARGET" --source "$RELEASE_SOURCE" --build "$RELEASE_BUILD_ID"

  notify:
    name: Notify connected apps about stable
    needs: promote
    if: inputs.promotion == 'latest → stable' || inputs.promotion == 'nightly → stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install notification tooling
        run: npm ci --ignore-scripts
      - name: Verify workflow identity and refresh stable
        env:
          CRYSTAL_RELEASE_NOTIFY_URL: ${{ vars.CRYSTAL_RELEASE_NOTIFY_URL }}
        run: npm run ci -- notify-release
