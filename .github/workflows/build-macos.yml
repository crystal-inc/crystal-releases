name: Build macOS installers

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Trusted Crystal source branch, tag or commit
        required: true
        default: main
        type: string
      version:
        description: Test installer version (without v)
        required: true
        default: "0.1.0"
        type: string
  repository_dispatch:
    types: [crystal-native-build]

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.event.client_payload.build_key || github.run_id }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.96.0
  EMSDK_VERSION: 6.0.0
  TAURI_CLI_VERSION: 2.11.4

jobs:
  prepare:
    name: Verify source and release bot access
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.request.outputs.commit }}
      version: ${{ steps.request.outputs.version }}
      kind: ${{ steps.request.outputs.kind }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install CI tooling
        run: npm ci --ignore-scripts
      - name: Check distribution request validation
        run: |
          npm run check-types
          npm test
      - name: Read-only token for source repositories
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CRYSTAL_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CRYSTAL_RELEASE_BOT_PRIVATE_KEY }}
          owner: crystal-inc
          repositories: crystal,crystal-server
          permission-contents: read
      - name: Resolve one commit and verify pinned helper access
        id: request
        env:
          RELEASE_APP_SLUG: ${{ steps.source-token.outputs.app-slug }}
          SOURCE_READ_TOKEN: ${{ steps.source-token.outputs.token }}
        run: npm run ci -- request

  build:
    name: macOS ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: aarch64
            rust-host: aarch64-apple-darwin
          - runner: macos-26-intel
            arch: x86_64
            rust-host: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CRYSTAL_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      CRYSTAL_SOURCE_SHA: ${{ needs.prepare.outputs.commit }}
      CRYSTAL_BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout public distribution tooling
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set artifact directory
        run: |
          echo "CRYSTAL_RELEASE_OUTPUT=$RUNNER_TEMP/crystal-release" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/crystal-source"
      - name: Read-only token for source repositories
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CRYSTAL_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CRYSTAL_RELEASE_BOT_PRIVATE_KEY }}
          owner: crystal-inc
          repositories: crystal,crystal-server
          permission-contents: read
      - name: Fetch pinned source and helper without public checkout logs
        env:
          SOURCE_READ_TOKEN: ${{ steps.source-token.outputs.token }}
        run: bash scripts/ci/private-step.sh Checkout bash "$GITHUB_WORKSPACE/scripts/ci/checkout-source.sh"
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.9
      - name: Setup portable Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install CI tooling
        run: npm ci --ignore-scripts
      - name: Prepare dependency cache fingerprints
        id: dependencies
        run: npm run ci -- cache
      - name: Restore public pnpm registry packages
        if: steps.dependencies.outputs.pnpm_public == 'true'
        id: pnpm-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/crystal-pnpm-store
          key: public-pnpm-${{ runner.os }}-${{ runner.arch }}-9.15.9-v1-${{ steps.dependencies.outputs.pnpm_key }}
          restore-keys: public-pnpm-${{ runner.os }}-${{ runner.arch }}-9.15.9-v1-
      - name: Fetch packages in isolation from application source
        if: steps.dependencies.outputs.pnpm_public == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/private-step.sh Registry-packages bash "$GITHUB_WORKSPACE/scripts/ci/fetch-public-packages.sh"
      - name: Save public packages before any application install or build
        if: steps.dependencies.outputs.pnpm_public == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/crystal-pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: Install private workspace dependencies
        run: bash scripts/ci/private-step.sh Dependencies pnpm install --frozen-lockfile --ignore-scripts --prefer-offline --store-dir "$RUNNER_TEMP/crystal-pnpm-store"
      - name: Cache public Rust toolchain
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/${{ env.RUSTUP_TOOLCHAIN }}-${{ matrix.rust-host }}
            ~/.rustup/update-hashes/${{ env.RUSTUP_TOOLCHAIN }}-${{ matrix.rust-host }}
          key: public-rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-minimal-src-emscripten-v1
      - name: Install pinned Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src --target wasm32-unknown-emscripten
      - name: Cache only public crates.io download archives
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/registry/cache/index.crates.io-*/*.crate
          key: public-cargo-crates-${{ runner.os }}-${{ runner.arch }}-v1-${{ steps.dependencies.outputs.cargo_key }}
          restore-keys: public-cargo-crates-${{ runner.os }}-${{ runner.arch }}-v1-
      - name: Cache public emsdk
        id: emsdk
        uses: actions/cache@v6.1.0
        with:
          path: ~/emsdk
          key: public-emsdk-${{ runner.os }}-${{ runner.arch }}-${{ env.EMSDK_VERSION }}
      - name: Install emsdk
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Activate emsdk
        run: echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
      # Application source, Cargo targets, extracted registry sources and WASM
      # outputs are not cached. pnpm's public store is saved before private work.
      - name: Restore public pinned Tauri CLI
        id: tauri-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: public-tauri-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TAURI_CLI_VERSION }}
      - name: Install and validate Tauri CLI
        run: |
          if [ "$(cargo tauri --version 2>/dev/null || true)" != "tauri-cli $TAURI_CLI_VERSION" ]; then
            cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked --force
          fi
          test "$(cargo tauri --version)" = "tauri-cli $TAURI_CLI_VERSION"
      - name: Save validated public CLI
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: ${{ steps.tauri-cache.outputs.cache-primary-key }}
      - name: Check native tooling types
        run: bash scripts/ci/private-step.sh Types pnpm --dir apps/native exec tsc -p tsconfig.node.json --noEmit
      - name: Check native lifecycle and release metadata
        run: bash scripts/ci/private-step.sh Tests pnpm --dir apps/native exec vitest run --config vitest.release.config.ts
      - name: Build and verify ad-hoc signed DMG
        run: bash scripts/ci/private-step.sh Packaging pnpm --dir apps/native run release:package
      - name: Prepare explicit public artifact allowlist
        run: npm run ci -- artifacts
      - name: Upload only installer and checksum
        uses: actions/upload-artifact@v7.0.1
        with:
          name: crystal-macos-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/crystal-public-artifacts/Crystal_${{ env.CRYSTAL_RELEASE_VERSION }}_darwin-${{ matrix.arch }}.dmg
            ${{ runner.temp }}/crystal-public-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          archive: true
      - name: Remove private checkout and diagnostics
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/crystal-source" "$RUNNER_TEMP/crystal-release"
          rm -rf "$RUNNER_TEMP/crystal-dependency-fetch" "$RUNNER_TEMP/crystal-pnpm-store"
          rm -f "$RUNNER_TEMP"/crystal-private-*.log

  nightly:
    name: Publish verified nightly installers
    needs: [prepare, build]
    if: needs.prepare.outputs.kind == 'nightly'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-channels
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install release tooling
        run: npm ci --ignore-scripts
      - name: Download only verified architecture artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: crystal-macos-*
          path: ${{ runner.temp }}/crystal-channel-artifacts
      - name: Publish nightly and update its channel pointer
        env:
          GH_TOKEN: ${{ github.token }}
          CRYSTAL_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          CRYSTAL_SOURCE_SHA: ${{ needs.prepare.outputs.commit }}
          CRYSTAL_ARTIFACTS_DIRECTORY: ${{ runner.temp }}/crystal-channel-artifacts
        run: npm run release -- nightly
